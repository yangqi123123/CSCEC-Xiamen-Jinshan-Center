<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>房源管理 - 中建四局智能运营管理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/house-management.css?v=1">
</head>
<body class="house-page" data-menu-key="project.house" data-page-section="项目管理" data-page-title="房源管理">
  <div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header><main class="main"><div class="screen-frame stack">
    <section class="card filters house-filters"><div class="filter-actions">
      <label class="form-field"><span class="form-label">所属项目</span><select class="form-control" data-filter="project"><option value="">请选择</option><option>厦门金山财富中心</option><option>福州滨海新城项目</option></select></label><label class="form-field"><span class="form-label">所属楼栋</span><select class="form-control" data-filter="building"><option value="">请选择</option><option>1号楼</option><option>2号楼</option><option>A座</option></select></label><label class="form-field"><span class="form-label">所属楼层</span><select class="form-control" data-filter="floor"><option value="">请选择</option><option>一层</option><option>二层</option><option>B1层</option></select></label><label class="form-field"><span class="form-label">房源名称/房号</span><input class="form-control" data-filter="name" placeholder="请输入"></label><label class="form-field"><span class="form-label">房源编码</span><input class="form-control" data-filter="code" placeholder="请输入"></label><label class="form-field"><span class="form-label">房源类型</span><select class="form-control" data-filter="type"><option value="">请选择</option><option>办公</option><option>商业</option><option>车位</option></select></label><label class="form-field"><span class="form-label">装修情况</span><select class="form-control" data-filter="decoration"><option value="">请选择</option><option>毛坯</option><option>精装</option><option>简装</option></select></label><label class="form-field"><span class="form-label">房源状态</span><select class="form-control" data-filter="status"><option value="">请选择</option><option>空置</option><option>已售</option><option>已租</option><option>锁定</option></select></label><label class="form-field"><span class="form-label">房源属性</span><select class="form-control" data-filter="property"><option value="">请选择</option><option>可售</option><option>可租</option><option>自持</option></select></label><button class="btn btn-ghost" type="button" data-action="collapse">收起 <i class="fa-solid fa-chevron-up"></i></button><button class="btn btn-secondary" type="button" data-action="reset">重置</button><button class="btn btn-primary" type="button" data-action="search">搜索</button>
    </div></section>
    <section class="card house-list-card"><div class="card-title-row house-toolbar"><h2 class="card-title">房源管理</h2><div class="btn-row"><button class="btn btn-secondary" type="button" data-action="export"><i class="fa-solid fa-download"></i> 导出</button><button class="btn btn-danger-outline" type="button" data-action="delete-selected" disabled>删除</button><button class="btn btn-primary" type="button" data-action="create"><i class="fa-solid fa-plus"></i> 新增</button><button class="icon-btn" type="button" title="刷新" aria-label="刷新" data-action="refresh"><i class="fa-solid fa-rotate-right"></i></button><button class="icon-btn" type="button" title="全屏" aria-label="全屏"><i class="fa-solid fa-expand"></i></button><button class="icon-btn" type="button" title="列设置" aria-label="列设置"><i class="fa-solid fa-gear"></i></button></div></div><div class="table-wrap"><table class="table house-table table-actions-sticky" aria-label="房源列表"><thead><tr><th class="check-cell"><input type="checkbox" data-select-all></th><th>序号</th><th>所属项目</th><th>所属楼栋</th><th>所属楼层</th><th>房源名称/房号</th><th>房源编码</th><th>建筑面积(m²)</th><th>套内面积(m²)</th><th>房源属性</th><th>房源类型</th><th>装修情况</th><th>房源状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="houseTableBody"></tbody></table></div><div class="pagination"><span>共 <strong id="houseCount">0</strong> 条记录，每页 10 条</span><span class="page-item disabled">‹</span><span class="page-item active">1</span><span class="page-item disabled">›</span></div></section>
  </div></main></div>
  <script src="../../../app/config/menu.js?v=project-1"></script><script src="../../../app/components/sidebar.js?v=project-1"></script><script src="../../../app/components/header.js?v=project-1"></script><script src="../../../app/components/drawer.js"></script><script src="../../../app/components/requirement.js"></script>
  <script>
    const houseTypeOptions = ["办公", "商业", "车位", "弱电井", "弱电机房", "数据中心机房", "消控室", "网络机房", "供配电设备用房", "茶水间", "卫生间", "设备竖井", "其他"];
    document.querySelectorAll("select").forEach((select) => {
      const label = select.closest("label")?.querySelector(".form-label")?.textContent.trim();
      if (label !== "房源类型") return;
      const current = select.value;
      select.innerHTML = '<option value="">请选择</option>' + houseTypeOptions.map((item) => `<option>${item}</option>`).join("");
      if (current) select.value = current;
    });
    const houses=[{id:1,project:"厦门金山财富中心",building:"1号楼",floor:"一层",name:"101",code:"JS-01-0101",area:"1,280",inside:"980",rentable:"1,180",property:"可售",type:"办公",decoration:"精装",status:"空置",orientation:"南",rentAttribute:"可租",canMarket:true,created:"2026-09-02 13:20:12",note:"临近大堂，采光良好"},{id:2,project:"厦门金山财富中心",building:"1号楼",floor:"二层",name:"201",code:"JS-01-0201",area:"1,560",inside:"1,210",rentable:"1,430",property:"可租",type:"商业",decoration:"毛坯",status:"已租",orientation:"东南",rentAttribute:"可租",canMarket:false,created:"2026-09-02 13:21:35",note:"商业配套房源"},{id:3,project:"福州滨海新城项目",building:"A座",floor:"设备层",name:"A-M01",code:"FZ-A-M01",area:"420",inside:"360",rentable:"0",property:"自持",type:"办公",decoration:"简装",status:"锁定",orientation:"北",rentAttribute:"不可租",canMarket:false,created:"2026-08-16 17:35:20",note:"设备及运维用房"}];
    houses.forEach((item)=>{if(item.status==="锁定")item.status="空置";if(item.orientation==="东南")item.orientation="东";item.rentAttribute=item.rentAttribute==="可租"?"租赁":item.rentAttribute==="可售"?"出售":"自用";});
    const body=document.getElementById("houseTableBody"),count=document.getElementById("houseCount");let filteredHouses=houses;
    const esc=(value)=>String(value??"").replace(/[&<>\"]/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[char]));
    function renderRows(list=filteredHouses){filteredHouses=list;body.innerHTML=list.map((item,index)=>`<tr data-house-id="${item.id}"><td class="check-cell"><input type="checkbox" data-house-check></td><td>${index+1}</td><td>${esc(item.project)}</td><td>${esc(item.building)}</td><td>${esc(item.floor)}</td><td>${esc(item.name)}</td><td>${esc(item.code)}</td><td>${item.area}</td><td>${item.inside}</td><td>${esc(item.property)}</td><td>${esc(item.type)}</td><td>${esc(item.decoration)}</td><td><span class="tag ${item.status==="空置"?"success":item.status==="已售"?"primary":"warning"}">${item.status}</span></td><td>${item.created}</td><td><button class="table-action" data-house-action="detail" data-house-id="${item.id}">详情</button><button class="table-action" data-house-action="edit" data-house-id="${item.id}">编辑</button><button class="table-action status-danger" data-house-action="delete" data-house-id="${item.id}">删除</button></td></tr>`).join("");count.textContent=list.length;updateSelection();}
    function houseById(id){return houses.find((item)=>String(item.id)===String(id))||houses[0];}
    function detailBody(item){return `<section class="detail-section"><h3 class="detail-title">房源信息</h3><div class="detail-grid"><div class="info-item"><span class="info-label">所属项目</span><span class="info-value">${esc(item.project)}</span></div><div class="info-item"><span class="info-label">所属楼栋</span><span class="info-value">${esc(item.building)}</span></div><div class="info-item"><span class="info-label">所属楼层</span><span class="info-value">${esc(item.floor)}</span></div><div class="info-item"><span class="info-label">房源名称/房号</span><span class="info-value">${esc(item.name)}</span></div><div class="info-item"><span class="info-label">房源编码</span><span class="info-value">${esc(item.code)}</span></div><div class="info-item"><span class="info-label">房源类型</span><span class="info-value">${item.type}</span></div><div class="info-item"><span class="info-label">建筑面积</span><span class="info-value">${item.area} m²</span></div><div class="info-item"><span class="info-label">套内面积</span><span class="info-value">${item.inside} m²</span></div><div class="info-item"><span class="info-label">房源属性</span><span class="info-value">${item.property}</span></div><div class="info-item"><span class="info-label">房源状态</span><span class="info-value"><span class="tag primary">${item.status}</span></span></div><div class="info-item"><span class="info-label">创建时间</span><span class="info-value">${item.created}</span></div><div class="info-item"><span class="info-label">是否可招商</span><span class="info-value">${item.canMarket?"是":"否"}</span></div></div></section><section class="detail-section"><h3 class="detail-title">备注</h3><p class="detail-text">${esc(item.note||"-")}</p></section>`;}
    function formBody(item,mode){const isCreate=mode==="create",value=(key)=>isCreate?"":esc(item[key]);return `<div class="form-grid-2"><label class="form-field form-item"><span class="form-label form-required">所属项目</span><select class="form-control"><option>厦门金山财富中心</option><option>福州滨海新城项目</option></select></label><label class="form-field form-item"><span class="form-label form-required">所属楼栋</span><select class="form-control"><option>1号楼</option><option>2号楼</option><option>A座</option></select></label><label class="form-field form-item"><span class="form-label form-required">所属楼层</span><select class="form-control"><option>一层</option><option>二层</option><option>B1层</option><option>设备层</option></select></label><label class="form-field form-item"><span class="form-label form-required">房源名称/房号</span><input class="form-control" maxlength="20" value="${value("name")}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label form-required">房源编码</span><input class="form-control" maxlength="30" value="${value("code")}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label form-required">建筑面积(m²)</span><input class="form-control" value="${value("area")}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label form-required">套内面积(m²)</span><input class="form-control" value="${value("inside")}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label">可租面积(m²)</span><input class="form-control" value="${value("rentable")}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label">房源类型</span><select class="form-control"><option>办公</option><option>商业</option><option>车位</option></select></label><label class="form-field form-item"><span class="form-label">装修情况</span><select class="form-control"><option>毛坯</option><option>精装</option><option>简装</option></select></label><label class="form-field form-item"><span class="form-label">朝向</span><select class="form-control"><option>请选择</option><option>南</option><option>东南</option><option>北</option></select></label><label class="form-field form-item"><span class="form-label">租售属性</span><select class="form-control"><option>可租</option><option>可售</option><option>不可租售</option></select></label><label class="form-field form-item"><span class="form-label">房源状态</span><select class="form-control"><option>空置</option><option>已售</option><option>已租</option><option>锁定</option></select></label><label class="form-field form-item"><span class="form-label">是否可招商</span><label class="switch-line"><span>是</span><input type="checkbox" ${isCreate||item.canMarket?"checked":""}></label></label></div><label class="form-field form-item"><span class="form-label">附件</span><div class="upload-box"><i class="fa-solid fa-cloud-arrow-up"></i><p>点击或拖拽文件到此处上传</p><small>支持 xlsx、csv、docx、pdf 格式</small></div></label><label class="form-field form-item"><span class="form-label">备注</span><textarea class="form-control textarea" maxlength="200" placeholder="请输入">${value("note")}</textarea><span class="field-count">0/200</span></label>`;}
    let activeHouseDrawerItem=houses[0],activeHouseDrawerMode="detail";
    function openHouseDrawer(mode,item=houses[0]){const isCreate=mode==="create";activeHouseDrawerItem=item;activeHouseDrawerMode=mode;window.openAppDrawer({title:isCreate?"新增房源":mode==="edit"?"编辑房源":"房源详情",subtitle:`项目管理 · 房源管理${isCreate?"":` · ${item.name}`}`,body:mode==="detail"?detailBody(item):formBody(item,mode),footer:`<button class="btn btn-secondary" type="button" data-drawer-close>${mode==="detail"?"关闭":"取消"}</button>${mode==="detail"?"":`<button class="btn btn-primary" type="button" data-drawer-close>确认</button>`}`});}
    function confirmDelete(item){window.openAppConfirm({title:"提示",message:`确认删除房源「${item.name}」吗？`,onConfirm:()=>{const index=houses.findIndex((entry)=>entry.id===item.id);if(index>=0)houses.splice(index,1);renderRows();}});}
    function updateSelection(){document.querySelector('[data-action="delete-selected"]').disabled=!document.querySelector("[data-house-check]:checked");}
    document.querySelectorAll('.icon-btn').forEach((button)=>button.remove());
    document.querySelector('.house-filters [data-filter="project"]')?.closest('.form-field')?.remove();
    const houseStatusFilter=document.querySelector('.house-filters [data-filter="status"]');if(houseStatusFilter)houseStatusFilter.innerHTML='<option value="">请选择</option><option>空置</option><option>已售</option><option>已租</option>';
    renderRows();
    const panoramaBuildings=[
      {name:"1号楼",floors:[{name:"一层",rooms:["101","102","103","104","105","106","107","108"]},{name:"二层",rooms:["201","202","203","204","205","206","207","208"]},{name:"B1层",rooms:["B101","B102","B103","B104"]}]},
      {name:"2号楼",floors:[{name:"一层",rooms:["101","102","103","104","105","106"]},{name:"二层",rooms:["201","202","203","204","205","206"]}]},
      {name:"A座",floors:[{name:"一层",rooms:["A-101","A-102","A-103","A-104"]},{name:"设备层",rooms:["A-M01","A-M02","A-M03"]}]}
    ];
    const panoramaRoomZones=[
      {left:12,top:14,width:19,height:21},{left:32,top:14,width:17,height:21},{left:51,top:14,width:17,height:21},{left:69,top:14,width:19,height:21},
      {left:12,top:62,width:19,height:22},{left:32,top:62,width:17,height:22},{left:51,top:62,width:17,height:22},{left:69,top:62,width:19,height:22}
    ];
    let panoramaFiles=new Map();
    const panoramaKey=(building,floor,room)=>`${building} / ${floor} / ${room}`;
    const currentPanoramaKey=(item)=>panoramaKey(item.building,item.floor,item.name);
    function panoramaFloorButtons(selectedFloor){return panoramaBuildings.map((building)=>`<section><h3 class="panorama-building-title">${esc(building.name)}</h3>${building.floors.map((floor)=>{const key=`${building.name} / ${floor.name}`;return `<button class="panorama-floor-button${key===selectedFloor?" active":""}" type="button" data-panorama-floor="${esc(key)}">${esc(floor.name)}</button>`;}).join("")}</section>`).join("");}
    function panoramaFloorData(selectedFloor){const [buildingName,floorName]=selectedFloor.split(" / ");const building=panoramaBuildings.find((entry)=>entry.name===buildingName)||panoramaBuildings[0];return {building,floor:building.floors.find((entry)=>entry.name===floorName)||building.floors[0]};}
    function panoramaRoomsMarkup(selectedFloor,selectedRoom){const {floor}=panoramaFloorData(selectedFloor);return floor.rooms.map((room,index)=>{const zone=panoramaRoomZones[index%panoramaRoomZones.length];return `<button class="panorama-room${room===selectedRoom?" active":""}" type="button" data-panorama-room="${esc(room)}" style="left:${zone.left}%;top:${zone.top}%;width:${zone.width}%;height:${zone.height}%"><span>${esc(room)}</span></button>`;}).join("");}
    function panoramaPanelMarkup(selectedFloor,selectedRoom,draft){if(!selectedRoom)return '<div class="panorama-empty"><i class="fa-solid fa-vector-square"></i><strong>请选择房间</strong><span>在楼层平面图中点击房间后上传全景图</span><button class="btn btn-primary" type="button" disabled>上传360全景图</button></div>';const [building,floor]=selectedFloor.split(" / "),file=draft.get(panoramaKey(building,floor,selectedRoom));return `<div class="panorama-room-panel"><div class="panorama-room-meta"><span>当前房间</span><strong>${esc(selectedRoom)}</strong><small>${esc(building)} / ${esc(floor)}</small></div>${file?`<div class="panorama-preview-card"><img src="${file.url}" alt="${esc(selectedRoom)} 360全景图"><div class="panorama-file-name" title="${esc(file.name)}">${esc(file.name)}</div><div class="panorama-file-actions"><button class="table-action" type="button" data-panorama-preview>预览</button><button class="table-action" type="button" data-panorama-replace>更换</button><button class="table-action status-danger" type="button" data-panorama-delete>删除</button></div></div>`:`<div class="panorama-upload-empty"><i class="fa-regular fa-image"></i><span>当前房间暂未上传全景图</span></div><button class="btn btn-primary panorama-upload-button" type="button" data-panorama-upload><i class="fa-solid fa-upload"></i> 上传360全景图</button>`}<input type="file" accept=".jpg,.jpeg,.png,.webp,.bmp,image/jpeg,image/png,image/webp,image/bmp" hidden data-panorama-input></div>`;}
    function openPanoramaPreview(file,room){const preview=document.createElement("div");preview.className="panorama-image-mask";preview.innerHTML=`<section class="panorama-image-dialog" role="dialog" aria-modal="true"><header><strong>${esc(room)} · 360全景图</strong><button type="button" data-preview-close aria-label="关闭">×</button></header><img src="${file.url}" alt="${esc(room)} 360全景图"></section>`;document.body.append(preview);preview.addEventListener("click",(event)=>{if(event.target===preview||event.target.closest("[data-preview-close]"))preview.remove();});}
    function updatePanoramaDrawerStatus(item){const field=document.querySelector('[data-house-panorama-upload]');if(!field)return;const file=panoramaFiles.get(currentPanoramaKey(item));field.querySelector('[data-panorama-drawer-status]').textContent=file?file.name:"未上传";field.classList.toggle("has-file",Boolean(file));}
    function openPanoramaManager(item){
      document.querySelector('.panorama-manager-mask')?.remove();
      let selectedFloor=`${item.building} / ${item.floor}`;if(!panoramaFloorData(selectedFloor).building.floors.some((floor)=>`${item.building} / ${floor.name}`===selectedFloor))selectedFloor="1号楼 / 一层";
      let selectedRoom=panoramaFloorData(selectedFloor).floor.rooms.includes(item.name)?item.name:"";
      const draft=new Map(panoramaFiles),createdUrls=new Set();
      const mask=document.createElement("div");mask.className="panorama-manager-mask";
      mask.innerHTML=`<section class="panorama-manager-modal" role="dialog" aria-modal="true" aria-labelledby="panoramaTitle"><header class="panorama-modal-head"><h2 id="panoramaTitle">360全景图管理</h2><button type="button" data-panorama-close aria-label="关闭">×</button></header><div class="panorama-modal-body"><div class="panorama-picker"><aside class="panorama-floor-list" data-panorama-floors>${panoramaFloorButtons(selectedFloor)}</aside><main class="panorama-canvas"><h3 data-panorama-title>${esc(selectedFloor)} 楼层平面图</h3><div class="panorama-plan-wrap"><div class="panorama-plan-stage"><img src="../../assets/images/device-floor-plan.png" alt="楼层平面图"><div data-panorama-rooms>${panoramaRoomsMarkup(selectedFloor,selectedRoom)}</div></div></div></main><aside class="panorama-side-panel" data-panorama-panel>${panoramaPanelMarkup(selectedFloor,selectedRoom,draft)}</aside></div></div><footer class="panorama-modal-foot"><button class="btn btn-secondary" type="button" data-panorama-cancel>取消</button><button class="btn btn-primary" type="button" data-panorama-confirm>确定</button></footer></section>`;
      document.body.append(mask);
      const render=()=>{mask.querySelector('[data-panorama-title]').textContent=`${selectedFloor} 楼层平面图`;mask.querySelector('[data-panorama-rooms]').innerHTML=panoramaRoomsMarkup(selectedFloor,selectedRoom);mask.querySelector('[data-panorama-panel]').innerHTML=panoramaPanelMarkup(selectedFloor,selectedRoom,draft);};
      const close=(commit=false)=>{if(commit){panoramaFiles.forEach((file,key)=>{if(!draft.has(key)||draft.get(key).url!==file.url)URL.revokeObjectURL(file.url);});panoramaFiles=draft;createdUrls.forEach((url)=>{if(![...panoramaFiles.values()].some((file)=>file.url===url))URL.revokeObjectURL(url);});updatePanoramaDrawerStatus(item);}else createdUrls.forEach((url)=>URL.revokeObjectURL(url));mask.remove();};
      mask.addEventListener("click",(event)=>{
        const floorButton=event.target.closest('[data-panorama-floor]');if(floorButton){selectedFloor=floorButton.dataset.panoramaFloor;selectedRoom="";mask.querySelectorAll('[data-panorama-floor]').forEach((button)=>button.classList.toggle('active',button===floorButton));render();return;}
        const roomButton=event.target.closest('[data-panorama-room]');if(roomButton){selectedRoom=roomButton.dataset.panoramaRoom;render();return;}
        if(event.target.closest('[data-panorama-upload],[data-panorama-replace]')){mask.querySelector('[data-panorama-input]')?.click();return;}
        if(event.target.closest('[data-panorama-preview]')){const [building,floor]=selectedFloor.split(" / "),file=draft.get(panoramaKey(building,floor,selectedRoom));if(file)openPanoramaPreview(file,selectedRoom);return;}
        if(event.target.closest('[data-panorama-delete]')){const [building,floor]=selectedFloor.split(" / "),key=panoramaKey(building,floor,selectedRoom);window.openAppConfirm({title:"删除全景图",message:`确认删除房间「${selectedRoom}」的360全景图吗？`,onConfirm:()=>{draft.delete(key);render();}});return;}
        if(event.target.closest('[data-panorama-confirm]')){close(true);return;}
        if(event.target===mask||event.target.closest('[data-panorama-close],[data-panorama-cancel]'))close(false);
      });
      mask.addEventListener("change",(event)=>{if(!event.target.matches('[data-panorama-input]'))return;const file=event.target.files[0];if(!file)return;const allowed=/\.(jpe?g|png|webp|bmp)$/i.test(file.name);if(!allowed){window.openAppConfirm({title:"文件格式不支持",message:"请上传 jpg、jpeg、png、webp 或 bmp 格式的图片。",confirmText:"知道了"});return;}const [building,floor]=selectedFloor.split(" / "),key=panoramaKey(building,floor,selectedRoom),url=URL.createObjectURL(file);createdUrls.add(url);draft.set(key,{name:file.name,url,type:file.type});render();});
    }
    function ensureHousePanoramaUpload(){const drawerBody=document.getElementById('drawerBody');if(!drawerBody||drawerBody.querySelector('[data-house-panorama-upload]'))return;const attachment=[...drawerBody.querySelectorAll('.form-field')].find((field)=>field.querySelector('.form-label')?.textContent.trim()==='附件');if(!attachment)return;const field=document.createElement('div');field.className='form-field form-item house-panorama-field';field.dataset.housePanoramaUpload='';field.innerHTML='<span class="form-label">360全景图</span><div class="house-panorama-entry"><button class="btn btn-secondary" type="button" data-open-panorama><i class="fa-solid fa-panorama"></i> 上传全景图</button><span class="house-panorama-status" data-panorama-drawer-status>未上传</span></div><small class="house-panorama-help">每个房间支持上传一张 jpg、jpeg、png、webp、bmp 格式全景图</small>';attachment.parentNode.insertBefore(field,attachment);const panoramaItem=activeHouseDrawerMode==="create"?{...activeHouseDrawerItem,name:""}:activeHouseDrawerItem;field.querySelector('[data-open-panorama]').addEventListener('click',()=>openPanoramaManager(panoramaItem));updatePanoramaDrawerStatus(panoramaItem);}
    document.addEventListener('click',(event)=>{const button=event.target.closest('[data-action="collapse"]');if(!button)return;const filters=document.querySelector('.house-filters');const collapsed=filters.classList.toggle('is-collapsed');filters.querySelectorAll('.form-field').forEach((field,index)=>{if(index>=5){if(collapsed)field.style.display='none';else field.style.removeProperty('display');}});button.innerHTML=collapsed?'展开 <i class="fa-solid fa-chevron-down"></i>':'收起 <i class="fa-solid fa-chevron-up"></i>';event.stopImmediatePropagation();});
    function normalizeHouseDrawer(){const drawerBody=document.getElementById('drawerBody');if(!drawerBody)return;const selects=[...drawerBody.querySelectorAll('select')];const projectSelect=selects[0];if(projectSelect)projectSelect.disabled=true;const orientationSelect=selects[5];if(orientationSelect){const previous=orientationSelect.value;orientationSelect.innerHTML='<option>东</option><option>南</option><option>西</option><option>北</option>';orientationSelect.value=['东','南','西','北'].includes(previous)?previous:'东';}const rentSelect=selects[6];if(rentSelect){const previous=rentSelect.value;rentSelect.innerHTML='<option>租赁</option><option>出售</option><option>租售</option><option>自用</option>';rentSelect.value=['租赁','出售','租售','自用'].includes(previous)?previous:'租赁';}const statusSelect=selects[7];if(statusSelect){const previous=statusSelect.value;statusSelect.innerHTML='<option>空置</option><option>已售</option><option>已租</option>';statusSelect.value=['空置','已售','已租'].includes(previous)?previous:'空置';}const textarea=drawerBody.querySelector('textarea[maxlength]');if(textarea){let wrap=textarea.closest('.textarea-count-wrap');const count=textarea.parentElement.querySelector('.field-count');if(!wrap&&count){wrap=document.createElement('span');wrap.className='textarea-count-wrap';textarea.parentNode.insertBefore(wrap,textarea);wrap.append(textarea,count);}if(wrap){const counter=wrap.querySelector('.field-count');if(counter)counter.textContent=`${textarea.value.length}/${textarea.maxLength}`;}}}
    document.addEventListener('click',(event)=>{const action=event.target.closest('[data-action]')?.dataset.action;const rowAction=event.target.closest('[data-house-action]')?.dataset.houseAction;if(action==='create'||rowAction==='edit')setTimeout(()=>{normalizeHouseDrawer();ensureHousePanoramaUpload();document.querySelectorAll('#drawerBody label').forEach((field)=>{if(field.querySelector('.form-label')?.textContent.trim()!=='房源类型')return;const select=field.querySelector('select');if(select)select.innerHTML=houseTypeOptions.map((item)=>`<option>${item}</option>`).join('');});},0);});
    document.addEventListener('input',(event)=>{if(event.target.matches('#drawerBody textarea[maxlength]')){const counter=event.target.closest('.textarea-count-wrap')?.querySelector('.field-count');if(counter)counter.textContent=`${event.target.value.length}/${event.target.maxLength}`;}});
    document.addEventListener("click",(event)=>{const action=event.target.closest("[data-action]")?.dataset.action;if(action==="create")openHouseDrawer("create");if(action==="refresh")renderRows();if(action==="export")window.openAppDrawer({title:"导出房源",subtitle:"项目管理 · 房源管理",body:"<p>已按当前筛选条件生成房源列表导出任务。</p>",footer:'<button class="btn btn-primary" type="button" data-drawer-close>知道了</button>'});if(action==="reset"){document.querySelectorAll("[data-filter]").forEach((input)=>input.value="");renderRows(houses);}if(action==="search"){const f=Object.fromEntries([...document.querySelectorAll("[data-filter]")].map((input)=>[input.dataset.filter,input.value]));renderRows(houses.filter((item)=>(!f.project||item.project===f.project)&&(!f.building||item.building===f.building)&&(!f.floor||item.floor===f.floor)&&(!f.name||item.name.includes(f.name))&&(!f.code||item.code.includes(f.code))&&(!f.type||item.type===f.type)&&(!f.decoration||item.decoration===f.decoration)&&(!f.status||item.status===f.status)&&(!f.property||item.property===f.property)));}if(action==="collapse"){const filters=document.querySelector(".house-filters");const expanded=filters.classList.toggle("is-collapsed");filters.querySelectorAll(".form-field:nth-child(n+6)").forEach((field)=>{field.style.display=expanded?"none":"block";});event.target.closest("button").innerHTML=expanded?'展开 <i class="fa-solid fa-chevron-down"></i>':'收起 <i class="fa-solid fa-chevron-up"></i>';}if(action==="delete-selected"){const selected=[...document.querySelectorAll("[data-house-check]:checked")].map((input)=>houseById(input.closest("tr").dataset.houseId));if(selected.length)window.openAppConfirm({title:"提示",message:`确认删除选中的【${selected.length}】条房源记录吗？`,onConfirm:()=>{selected.forEach((item)=>{const index=houses.indexOf(item);if(index>=0)houses.splice(index,1);});renderRows();}});}const rowAction=event.target.closest("[data-house-action]");if(rowAction){const item=houseById(rowAction.dataset.houseId);if(rowAction.dataset.houseAction==="delete")confirmDelete(item);else openHouseDrawer(rowAction.dataset.houseAction,item);}if(event.target.matches("[data-house-check]"))updateSelection();});
    document.addEventListener("change",(event)=>{if(event.target.matches("[data-select-all]")){document.querySelectorAll("[data-house-check]").forEach((input)=>input.checked=event.target.checked);updateSelection();}});
  </script>
