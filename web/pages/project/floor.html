<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>楼层管理 - 中建四局智能运营管理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/floor-management.css?v=1">
</head>
<body class="floor-page" data-menu-key="project.floor" data-page-section="项目管理" data-page-title="楼层管理">
  <div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header><main class="main"><div class="screen-frame stack">
    <section class="card filters floor-filters"><div class="filter-actions">
      <label class="form-field"><span class="form-label">所属项目</span><select class="form-control" data-filter="project"><option value="">请选择</option><option>厦门金山财富中心</option><option>福州滨海新城项目</option></select></label><label class="form-field"><span class="form-label">所属楼栋</span><select class="form-control" data-filter="building"><option value="">请选择</option><option>1号楼</option><option>2号楼</option><option>A座</option></select></label><label class="form-field"><span class="form-label">楼层名称</span><input class="form-control" data-filter="name" placeholder="请输入"></label><label class="form-field"><span class="form-label">楼层编号/序号</span><input class="form-control" data-filter="code" placeholder="请输入"></label><label class="form-field floor-filter-extra"><span class="form-label">楼层类型</span><select class="form-control" data-filter="type"><option value="">请选择</option><option>标准层</option><option>地下层</option><option>设备层</option><option>屋面层</option></select></label><button class="btn btn-ghost" type="button" data-action="collapse">收起 <i class="fa-solid fa-chevron-up"></i></button><button class="btn btn-secondary" type="button" data-action="reset">重置</button><button class="btn btn-primary" type="button" data-action="search">搜索</button>
    </div></section>
    <section class="card floor-list-card"><div class="card-title-row floor-toolbar"><h2 class="card-title">楼层列表</h2><div class="btn-row"><button class="btn btn-secondary" type="button" data-action="export"><i class="fa-solid fa-download"></i> 导出</button><button class="btn btn-danger-outline" type="button" data-action="delete-selected" disabled>删除</button><button class="btn btn-primary" type="button" data-action="create"><i class="fa-solid fa-plus"></i> 新增</button><button class="icon-btn" type="button" title="刷新" aria-label="刷新" data-action="refresh"><i class="fa-solid fa-rotate-right"></i></button><button class="icon-btn" type="button" title="全屏" aria-label="全屏"><i class="fa-solid fa-expand"></i></button><button class="icon-btn" type="button" title="列设置" aria-label="列设置"><i class="fa-solid fa-gear"></i></button></div></div><div class="table-wrap"><table class="table floor-table table-actions-sticky" aria-label="楼层列表"><thead><tr><th class="check-cell"><input type="checkbox" data-select-all></th><th>序号</th><th>所属项目</th><th>所属楼栋</th><th>楼层名称</th><th>楼层编号/序号</th><th>楼层类型</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="floorTableBody"></tbody></table></div><div class="pagination"><span>共 <strong id="floorCount">0</strong> 条记录，每页 10 条</span><span class="page-item disabled">‹</span><span class="page-item active">1</span><span class="page-item disabled">›</span></div></section>
  </div></main></div>
  <script src="../../../app/config/menu.js?v=project-1"></script><script src="../../../app/components/sidebar.js?v=project-1"></script><script src="../../../app/components/header.js?v=project-1"></script><script src="../../../app/components/drawer.js"></script><script src="../../../app/components/requirement.js"></script>
  <script>
    const floors=[{id:1,project:"厦门金山财富中心",building:"1号楼",name:"一层",code:"1",type:"标准层",plan:"",created:"2026-09-02 11:03:12",note:"办公大堂及商业配套"},{id:2,project:"厦门金山财富中心",building:"1号楼",name:"二层",code:"2",type:"标准层",plan:"",created:"2026-09-02 11:04:28",note:"办公层"},{id:3,project:"厦门金山财富中心",building:"1号楼",name:"B1层",code:"B1",type:"地下层",plan:"",created:"2026-09-02 11:06:40",note:"停车及设备用房"},{id:4,project:"福州滨海新城项目",building:"A座",name:"设备层",code:"M1",type:"设备层",plan:"",created:"2026-08-16 17:12:05",note:"机电设备层"}];
    floors.forEach((item)=>{item.type=item.type==="地下层"||item.type==="设备层"?"地下楼层":"地上楼层";});
    const body=document.getElementById("floorTableBody"),count=document.getElementById("floorCount");let filteredFloors=floors;
    const esc=(value)=>String(value??"").replace(/[&<>\"]/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[char]));
    function renderRows(list=filteredFloors){filteredFloors=list;body.innerHTML=list.map((item,index)=>`<tr data-floor-id="${item.id}"><td class="check-cell"><input type="checkbox" data-floor-check></td><td>${index+1}</td><td>${esc(item.project)}</td><td>${esc(item.building)}</td><td>${esc(item.name)}</td><td>${esc(item.code)}</td><td><span class="tag ${item.type==="地下层"?"warning":item.type==="设备层"?"success":"primary"}">${item.type}</span></td><td>${item.created}</td><td><button class="table-action" data-floor-action="detail" data-floor-id="${item.id}">详情</button><button class="table-action" data-floor-action="edit" data-floor-id="${item.id}">编辑</button><button class="table-action" data-floor-action="house-management" data-floor-id="${item.id}">房源管理</button><button class="table-action status-danger" data-floor-action="delete" data-floor-id="${item.id}">删除</button></td></tr>`).join("");count.textContent=list.length;updateSelection();}
    function floorById(id){return floors.find((item)=>String(item.id)===String(id))||floors[0];}
    function detailBody(item){return `<section class="detail-section"><h3 class="detail-title">楼层信息</h3><div class="detail-grid"><div class="info-item"><span class="info-label">所属项目</span><span class="info-value">${esc(item.project)}</span></div><div class="info-item"><span class="info-label">所属楼栋</span><span class="info-value">${esc(item.building)}</span></div><div class="info-item"><span class="info-label">楼层名称</span><span class="info-value">${esc(item.name)}</span></div><div class="info-item"><span class="info-label">楼层编号/序号</span><span class="info-value">${esc(item.code)}</span></div><div class="info-item"><span class="info-label">楼层类型</span><span class="info-value"><span class="tag primary">${item.type}</span></span></div><div class="info-item"><span class="info-label">创建时间</span><span class="info-value">${item.created}</span></div></div></section><section class="detail-section"><h3 class="detail-title">备注</h3><p class="detail-text">${esc(item.note||"-")}</p></section>`;}
    function formBody(item,mode){const isCreate=mode==="create",value=(key)=>isCreate?"":esc(item[key]);return `<label class="form-field form-item"><span class="form-label form-required">所属项目</span><select class="form-control"><option>厦门金山财富中心</option><option>福州滨海新城项目</option></select></label><label class="form-field form-item"><span class="form-label form-required">所属楼栋</span><select class="form-control"><option>1号楼</option><option>2号楼</option><option>A座</option></select></label><label class="form-field form-item"><span class="form-label form-required">楼层名称</span><input class="form-control" maxlength="10" value="${value("name")}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label form-required">楼层编号/序号</span><input class="form-control" maxlength="10" value="${value("code")}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label form-required">楼层类型</span><select class="form-control"><option>标准层</option><option>地下层</option><option>设备层</option><option>屋面层</option></select></label><label class="form-field form-item"><span class="form-label">平面图</span><div class="upload-box"><i class="fa-solid fa-cloud-arrow-up"></i><p>点击或拖拽文件到此处上传</p><small>支持 xlsx、csv、docx、pdf 格式</small></div></label><label class="form-field form-item"><span class="form-label">备注</span><textarea class="form-control textarea" maxlength="200" placeholder="请输入">${value("note")}</textarea><span class="field-count">0/200</span></label>`;}
    function openFloorDrawer(mode,item=floors[0]){const isCreate=mode==="create";window.openAppDrawer({title:isCreate?"新增楼层":mode==="edit"?"编辑楼层":"楼层详情",subtitle:`项目管理 · 楼层管理${isCreate?"":` · ${item.name}`}`,body:mode==="detail"?detailBody(item):formBody(item,mode),footer:`<button class="btn btn-secondary" type="button" data-drawer-close>${mode==="detail"?"关闭":"取消"}</button>${mode==="detail"?"":`<button class="btn btn-primary" type="button" data-drawer-close>确认</button>`}`});}
    function confirmDelete(item){window.openAppConfirm({title:"提示",message:`确认删除楼层「${item.name}」吗？`,onConfirm:()=>{const index=floors.findIndex((entry)=>entry.id===item.id);if(index>=0)floors.splice(index,1);renderRows();}});}
    function updateSelection(){document.querySelector('[data-action="delete-selected"]').disabled=!document.querySelector("[data-floor-check]:checked");}
    document.querySelectorAll('.icon-btn').forEach((button)=>button.remove());
    document.querySelector('.floor-filters [data-filter="project"]')?.closest('.form-field')?.remove();
    const floorCodeFilter=document.querySelector('.floor-filters [data-filter="code"]');if(floorCodeFilter)floorCodeFilter.closest('.form-field').querySelector('.form-label').textContent='楼层编码';
    const floorTypeFilter=document.querySelector('.floor-filters [data-filter="type"]');if(floorTypeFilter)floorTypeFilter.innerHTML='<option value="">请选择</option><option>地上楼层</option><option>地下楼层</option>';
    const floorCodeHeader=document.querySelector('.floor-table thead th:nth-child(6)');if(floorCodeHeader)floorCodeHeader.textContent='楼层编码';
    renderRows();
    function normalizeFloorDrawer(){const drawerBody=document.getElementById('drawerBody');if(!drawerBody)return;const labels=[...drawerBody.querySelectorAll('.form-label')];const codeLabel=labels.find((label)=>label.textContent.trim()==='楼层编号/序号');if(codeLabel)codeLabel.textContent='楼层编码';const projectSelect=drawerBody.querySelector('select');if(projectSelect)projectSelect.disabled=true;const selects=[...drawerBody.querySelectorAll('select')];const typeSelect=selects[2];if(typeSelect){const previous=typeSelect.value;typeSelect.innerHTML='<option>地上楼层</option><option>地下楼层</option>';typeSelect.value=previous==='地下层'||previous==='设备层'?'地下楼层':'地上楼层';}const textarea=drawerBody.querySelector('textarea[maxlength]');if(textarea){let wrap=textarea.closest('.textarea-count-wrap');const count=textarea.parentElement.querySelector('.field-count');if(!wrap&&count){wrap=document.createElement('span');wrap.className='textarea-count-wrap';textarea.parentNode.insertBefore(wrap,textarea);wrap.append(textarea,count);}if(wrap){const counter=wrap.querySelector('.field-count');if(counter)counter.textContent=`${textarea.value.length}/${textarea.maxLength}`;}}}
    document.addEventListener('click',(event)=>{const action=event.target.closest('[data-action]')?.dataset.action;const rowAction=event.target.closest('[data-floor-action]')?.dataset.floorAction;if(action==='create'||rowAction==='edit'||rowAction==='detail')setTimeout(normalizeFloorDrawer,0);});
    document.addEventListener('input',(event)=>{if(event.target.matches('#drawerBody textarea[maxlength]')){const counter=event.target.closest('.textarea-count-wrap')?.querySelector('.field-count');if(counter)counter.textContent=`${event.target.value.length}/${event.target.maxLength}`;}});
    document.addEventListener("click",(event)=>{const action=event.target.closest("[data-action]")?.dataset.action;if(action==="create")openFloorDrawer("create");if(action==="refresh")renderRows();if(action==="export")window.openAppDrawer({title:"导出楼层",subtitle:"项目管理 · 楼层管理",body:"<p>已按当前筛选条件生成楼层列表导出任务。</p>",footer:'<button class="btn btn-primary" type="button" data-drawer-close>知道了</button>'});if(action==="reset"){document.querySelectorAll("[data-filter]").forEach((input)=>input.value="");renderRows(floors);}if(action==="search"){const f=Object.fromEntries([...document.querySelectorAll("[data-filter]")].map((input)=>[input.dataset.filter,input.value]));renderRows(floors.filter((item)=>(!f.project||item.project===f.project)&&(!f.building||item.building===f.building)&&(!f.name||item.name.includes(f.name))&&(!f.code||item.code.includes(f.code))&&(!f.type||item.type===f.type)));}if(action==="collapse"){const extra=document.querySelector(".floor-filter-extra"),expanded=document.querySelector(".floor-filters").classList.toggle("is-expanded");extra.style.display=expanded?"block":"none";event.target.closest("button").innerHTML=expanded?'收起 <i class="fa-solid fa-chevron-up"></i>':'展开 <i class="fa-solid fa-chevron-down"></i>';}if(action==="delete-selected"){const selected=[...document.querySelectorAll("[data-floor-check]:checked")].map((input)=>floorById(input.closest("tr").dataset.floorId));if(selected.length)window.openAppConfirm({title:"提示",message:`确认删除选中的【${selected.length}】条楼层记录吗？`,onConfirm:()=>{selected.forEach((item)=>{const index=floors.indexOf(item);if(index>=0)floors.splice(index,1);});renderRows();}});}const rowAction=event.target.closest("[data-floor-action]");if(rowAction){if(rowAction.dataset.floorAction==="house-management"){const item=floorById(rowAction.dataset.floorId);location.href=`house.html?project=${encodeURIComponent(item.project)}&building=${encodeURIComponent(item.building)}&floor=${encodeURIComponent(item.name)}`;return;}const item=floorById(rowAction.dataset.floorId);if(rowAction.dataset.floorAction==="delete")confirmDelete(item);else openFloorDrawer(rowAction.dataset.floorAction,item);}if(event.target.matches("[data-floor-check]"))updateSelection();});
    document.addEventListener("change",(event)=>{if(event.target.matches("[data-select-all]")){document.querySelectorAll("[data-floor-check]").forEach((input)=>input.checked=event.target.checked);updateSelection();}});
  </script>
</body>
</html>
