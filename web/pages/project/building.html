<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>楼栋管理 - 中建四局智能运营管理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/building-management.css?v=1">
</head>
<body class="building-page" data-menu-key="project.building" data-page-section="项目管理" data-page-title="楼栋管理">
  <div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header><main class="main"><div class="screen-frame stack">
    <section class="card filters building-filters"><div class="filter-actions">
      <label class="form-field"><span class="form-label">楼栋名称</span><input class="form-control" data-filter="name" placeholder="请输入"></label>
      <label class="form-field"><span class="form-label">楼栋编码</span><input class="form-control" data-filter="code" placeholder="请输入"></label>
      <label class="form-field filter-field-extra"><span class="form-label">楼栋状态</span><select class="form-control" data-filter="status"><option value="">请选择</option><option>未开工</option><option>停工</option><option>竣备</option><option>其他</option></select></label>
      <button class="btn btn-ghost" type="button" data-action="collapse">展开 <i class="fa-solid fa-chevron-down"></i></button><button class="btn btn-secondary" type="button" data-action="reset">重置</button><button class="btn btn-primary" type="button" data-action="search">搜索</button>
    </div></section>
    <section class="card building-list-card"><div class="card-title-row building-toolbar"><h2 class="card-title">楼栋列表</h2><div class="btn-row">
      <button class="btn btn-secondary" type="button" data-action="export"><i class="fa-solid fa-download"></i> 导出</button><button class="btn btn-danger-outline" type="button" data-action="delete-selected" disabled>删除</button><button class="btn btn-primary" type="button" data-action="create"><i class="fa-solid fa-plus"></i> 新增</button><button class="icon-btn" type="button" title="刷新" aria-label="刷新" data-action="refresh"><i class="fa-solid fa-rotate-right"></i></button><button class="icon-btn" type="button" title="全屏" aria-label="全屏"><i class="fa-solid fa-expand"></i></button><button class="icon-btn" type="button" title="列设置" aria-label="列设置"><i class="fa-solid fa-gear"></i></button>
    </div></div><div class="table-wrap"><table class="table building-table table-actions-sticky" aria-label="楼栋列表"><thead><tr><th class="check-cell"><input type="checkbox" data-select-all></th><th>序号</th><th>所属项目</th><th>楼栋名称</th><th>楼栋编码</th><th>地上楼层数</th><th>地下楼层数</th><th>总楼层数</th><th>建筑面积(m²)</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="buildingTableBody"></tbody></table></div><div class="pagination"><span>共 <strong id="buildingCount">0</strong> 条记录，每页 10 条</span><span class="page-item disabled">‹</span><span class="page-item active">1</span><span class="page-item disabled">›</span></div></section>
  </div></main></div>
  <script src="../../../app/config/menu.js?v=project-1"></script><script src="../../../app/components/sidebar.js?v=project-1"></script><script src="../../../app/components/header.js?v=project-1"></script><script src="../../../app/components/drawer.js"></script><script src="../../../app/components/requirement.js"></script>
  <script>
    const buildings=[{id:1,project:"厦门金山财富中心",name:"1号楼",code:"JS-01",above:32,below:2,total:34,area:"52,800",status:"未开工",address:"湖里区金山路 88 号",height:"128",completion:"2028-12-31",useDate:"2029-03-01",created:"2026-09-02 10:15:32",note:"主塔楼，办公及商业配套"},{id:2,project:"厦门金山财富中心",name:"2号楼",code:"JS-02",above:28,below:2,total:30,area:"41,600",status:"停工",address:"湖里区金山路 88 号",height:"112",completion:"2028-12-31",useDate:"2029-03-01",created:"2026-09-02 10:18:08",note:"办公楼"},{id:3,project:"福州滨海新城项目",name:"A座",code:"FZ-A-01",above:18,below:1,total:19,area:"26,400",status:"竣备",address:"滨海新城环湖路 12 号",height:"76",completion:"2025-11-20",useDate:"2026-01-15",created:"2026-08-16 16:42:10",note:"配套服务楼"}];
    const buildingRelations={1:{floors:3,houses:2},2:{floors:0,houses:0},3:{floors:1,houses:1}};
    const body=document.getElementById("buildingTableBody"),count=document.getElementById("buildingCount");let filteredBuildings=buildings;
    const esc=(value)=>String(value??"").replace(/[&<>\"]/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[char]));
    function renderRows(list=filteredBuildings){filteredBuildings=list;body.innerHTML=list.map((item,index)=>`<tr data-building-id="${item.id}"><td class="check-cell"><input type="checkbox" data-building-check></td><td>${index+1}</td><td>${esc(item.project)}</td><td>${esc(item.name)}</td><td>${esc(item.code)}</td><td>${item.above}</td><td>${item.below}</td><td>${item.total}</td><td>${item.area}</td><td>${item.created}</td><td><button class="table-action" data-building-action="detail" data-building-id="${item.id}">详情</button><button class="table-action" data-building-action="edit" data-building-id="${item.id}">编辑</button><button class="table-action" data-building-action="floor-management" data-building-id="${item.id}">楼层管理</button><button class="table-action status-danger" data-building-action="delete" data-building-id="${item.id}">删除</button></td></tr>`).join("");count.textContent=list.length;updateSelection();}
    function buildingById(id){return buildings.find((item)=>String(item.id)===String(id))||buildings[0];}
    function detailBody(item){return `<section class="detail-section"><h3 class="detail-title">楼栋信息</h3><div class="detail-grid"><div class="info-item"><span class="info-label">所属项目</span><span class="info-value">${esc(item.project)}</span></div><div class="info-item"><span class="info-label">楼栋名称</span><span class="info-value">${esc(item.name)}</span></div><div class="info-item"><span class="info-label">楼栋编码</span><span class="info-value">${esc(item.code)}</span></div><div class="info-item"><span class="info-label">楼栋状态</span><span class="info-value"><span class="tag ${item.status==="竣备"?"success":"primary"}">${item.status}</span></span></div><div class="info-item"><span class="info-label">地上楼层数</span><span class="info-value">${item.above}</span></div><div class="info-item"><span class="info-label">地下楼层数</span><span class="info-value">${item.below}</span></div><div class="info-item"><span class="info-label">建筑面积</span><span class="info-value">${item.area} m²</span></div><div class="info-item"><span class="info-label">建筑高度</span><span class="info-value">${item.height} 米</span></div><div class="info-item"><span class="info-label">创建时间</span><span class="info-value">${item.created}</span></div><div class="info-item"><span class="info-label">楼栋地址</span><span class="info-value">${esc(item.address)}</span></div></div></section><section class="detail-section"><h3 class="detail-title">备注</h3><p class="detail-text">${esc(item.note||"-")}</p></section>`;}
    function formBody(item,mode){const isCreate=mode==="create",value=(key)=>isCreate?"":esc(item[key]),selectedProject=isCreate?"厦门金山财富中心":item.project,noteLength=isCreate?0:String(item.note||"").length;return `<div class="form-grid-2"><label class="form-field form-item"><span class="form-label form-required">所属项目</span><select class="form-control" disabled><option ${selectedProject==="厦门金山财富中心"?"selected":""}>厦门金山财富中心</option><option ${selectedProject==="福州滨海新城项目"?"selected":""}>福州滨海新城项目</option></select></label><label class="form-field form-item"><span class="form-label form-required">楼栋名称</span><input class="form-control" value="${value("name")}" placeholder="请输入楼栋名称"></label><label class="form-field form-item"><span class="form-label form-required">楼栋编码</span><input class="form-control" value="${value("code")}" placeholder="请输入楼栋编码"></label><label class="form-field form-item"><span class="form-label form-required">楼栋状态</span><select class="form-control"><option value="">请选择</option><option ${item.status==="未开工"?"selected":""}>未开工</option><option ${item.status==="停工"?"selected":""}>停工</option><option ${item.status==="竣备"?"selected":""}>竣备</option><option ${item.status==="其他"?"selected":""}>其他</option></select></label><label class="form-field form-item"><span class="form-label form-required">地上楼层数</span><input class="form-control" type="number" value="${value("above")}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label form-required">地下楼层数</span><input class="form-control" type="number" value="${value("below")}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label">总楼层数</span><input class="form-control" value="${isCreate?"":item.total}" disabled></label><label class="form-field form-item"><span class="form-label">建筑面积(m²)</span><input class="form-control" value="${value("area")}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label">产权面积(m²)</span><input class="form-control" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label">建筑高度(米)</span><input class="form-control" value="${value("height")}" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label">竣工时间</span><input class="form-control" type="date" value="${value("completion")}"></label><label class="form-field form-item"><span class="form-label">投用时间</span><input class="form-control" type="date" value="${value("useDate")}"></label></div><label class="form-field form-item"><span class="form-label">楼栋地址</span><input class="form-control" value="${value("address")}" placeholder="请输入楼栋地址"></label><label class="form-field form-item"><span class="form-label">楼栋附件</span><div class="upload-box"><i class="fa-solid fa-cloud-arrow-up"></i><p>点击或拖拽文件到此处上传</p><small>支持 jpg、png、pdf、docx 格式</small></div></label><label class="form-field form-item"><span class="form-label">备注</span><span class="textarea-count-wrap"><textarea class="form-control textarea" maxlength="200" placeholder="请输入">${value("note")}</textarea><span class="field-count">${noteLength}/200</span></span></label>`;}
    function openBuildingDrawer(mode,item=buildings[0]){const isCreate=mode==="create";window.openAppDrawer({title:isCreate?"新增楼栋":mode==="edit"?"编辑楼栋":"楼栋详情",subtitle:`项目管理 · 楼栋管理${isCreate?"":` · ${item.name}`}`,body:mode==="detail"?detailBody(item):formBody(item,mode),footer:`<button class="btn btn-secondary" type="button" data-drawer-close>${mode==="detail"?"关闭":"取消"}</button>${mode==="detail"?"":`<button class="btn btn-primary" type="button" data-drawer-close>确认</button>`}`});}
    function confirmDelete(item){const relation=buildingRelations[item.id]||{floors:0,houses:0};if(relation.floors||relation.houses){const links=[relation.floors?`${relation.floors} 个楼层`:"",relation.houses?`${relation.houses} 个房源`:""].filter(Boolean).join("、");window.openAppConfirm({title:"提示",message:`楼栋「${item.name}」已关联${links}，请先解除关联后再删除。`,confirmText:"知道了"});return;}window.openAppConfirm({title:"提示",message:`确认删除楼栋「${item.name}」吗？`,onConfirm:()=>{const index=buildings.findIndex((entry)=>entry.id===item.id);if(index>=0)buildings.splice(index,1);renderRows();}});}
    function updateSelection(){document.querySelector('[data-action="delete-selected"]').disabled=!document.querySelector("[data-building-check]:checked");}
    document.querySelectorAll('.icon-btn').forEach((button)=>button.remove());
    renderRows();
    function ensureBuildingPlanUpload(){const drawerBody=document.getElementById('drawerBody');if(!drawerBody||drawerBody.querySelector('[data-building-plan-upload]'))return;const attachment=[...drawerBody.querySelectorAll('.form-field')].find((field)=>field.querySelector('.form-label')?.textContent.trim()==='楼栋附件');if(!attachment)return;const field=document.createElement('label');field.className='form-field form-item';field.dataset.buildingPlanUpload='';field.innerHTML='<span class="form-label">平面图</span><div class="upload-box drawer-upload-box"><input type="file" accept="image/*,.pdf" hidden data-drawer-upload-input><button class="upload-trigger" type="button" data-drawer-upload-trigger><i class="fa-solid fa-cloud-arrow-up"></i><span>点击上传平面图</span></button><small>支持 jpg、jpeg、png、pdf 格式</small><div class="drawer-upload-name" data-drawer-upload-name></div></div>';attachment.parentNode.insertBefore(field,attachment);field.querySelector('[data-drawer-upload-trigger]').addEventListener('click',()=>field.querySelector('[data-drawer-upload-input]').click());field.querySelector('[data-drawer-upload-input]').addEventListener('change',(event)=>{field.querySelector('[data-drawer-upload-name]').textContent=event.target.files[0]?.name||'';});}
    document.addEventListener("click",(event)=>{const action=event.target.closest('[data-action="delete-selected"]');if(!action)return;const selected=[...document.querySelectorAll("[data-building-check]:checked")].map((input)=>buildingById(input.closest("tr").dataset.buildingId));const blocked=selected.filter((item)=>{const relation=buildingRelations[item.id]||{floors:0,houses:0};return relation.floors||relation.houses;});if(blocked.length){event.stopImmediatePropagation();const names=blocked.map((item)=>item.name).join("、");window.openAppConfirm({title:"提示",message:`楼栋「${names}」已关联楼层或房源，请先解除关联后再删除。`,confirmText:"知道了"});}});
    document.addEventListener("click",(event)=>{const action=event.target.closest("[data-action]")?.dataset.action;if(action==="create")openBuildingDrawer("create");if(action==="refresh")renderRows();if(action==="export")window.openAppDrawer({title:"导出楼栋",subtitle:"项目管理 · 楼栋管理",body:"<p>已按当前筛选条件生成楼栋列表导出任务。</p>",footer:'<button class="btn btn-primary" type="button" data-drawer-close>知道了</button>'});if(action==="reset"){document.querySelectorAll("[data-filter]").forEach((input)=>input.value="");renderRows(buildings);}if(action==="search"){const f=Object.fromEntries([...document.querySelectorAll("[data-filter]")].map((input)=>[input.dataset.filter,input.value]));renderRows(buildings.filter((item)=>(!f.project||item.project===f.project)&&(!f.name||item.name.includes(f.name))&&(!f.code||item.code.includes(f.code))&&(!f.status||item.status===f.status)));}if(action==="collapse"){const extra=document.querySelector(".filter-field-extra"),expanded=document.querySelector(".building-filters").classList.toggle("is-expanded");extra.style.display=expanded?"block":"none";event.target.closest("button").innerHTML=expanded?'收起 <i class="fa-solid fa-chevron-up"></i>':'展开 <i class="fa-solid fa-chevron-down"></i>';}if(action==="delete-selected"){const selected=[...document.querySelectorAll("[data-building-check]:checked")].map((input)=>buildingById(input.closest("tr").dataset.buildingId));if(selected.length)window.openAppConfirm({title:"提示",message:`确认删除选中的【${selected.length}】条楼栋记录吗？`,onConfirm:()=>{selected.forEach((item)=>{const index=buildings.indexOf(item);if(index>=0)buildings.splice(index,1);});renderRows();}});}const rowAction=event.target.closest("[data-building-action]");if(rowAction){if(rowAction.dataset.buildingAction==="floor-management"){const item=buildingById(rowAction.dataset.buildingId);location.href=`floor.html?project=${encodeURIComponent(item.project)}&building=${encodeURIComponent(item.name)}`;return;}const item=buildingById(rowAction.dataset.buildingId);if(rowAction.dataset.buildingAction==="delete")confirmDelete(item);else openBuildingDrawer(rowAction.dataset.buildingAction,item);}if(event.target.matches("[data-building-check]"))updateSelection();});
    document.addEventListener("change",(event)=>{if(event.target.matches("[data-select-all]")){document.querySelectorAll("[data-building-check]").forEach((input)=>input.checked=event.target.checked);updateSelection();}});
    document.addEventListener("input",(event)=>{if(event.target.matches("textarea[maxlength]")){const count=event.target.closest(".textarea-count-wrap")?.querySelector(".field-count");if(count)count.textContent=`${event.target.value.length}/${event.target.maxLength}`;}});
    document.addEventListener("click",(event)=>{const create=event.target.closest('[data-action="create"]');const edit=event.target.closest('[data-building-action="edit"]');if(create||edit)setTimeout(()=>{const status=[...document.querySelectorAll("#drawerBody select")].find((select)=>!select.disabled&&select.options.length===5);if(status){status.required=true;if(create)status.value="";}ensureBuildingPlanUpload();},0);});
  </script>
</body>
</html>
