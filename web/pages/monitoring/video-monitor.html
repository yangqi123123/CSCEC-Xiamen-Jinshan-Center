<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视频监控 - 中建四局智能运营管理系统</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/monitoring.css">
</head>
<body class="monitoring-page" data-menu-key="smart-monitoring.video" data-page-section="智能监测" data-page-title="视频监控">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="video-workspace">
          <aside class="video-sidebar">
            <div class="video-sidebar-head"><span>监控设备</span><span class="status-muted">433</span></div>
            <div class="video-floor-filter"><label class="form-field"><span class="form-label">选择楼层</span><select class="form-control" id="floorFilter"><option value="all">全部楼层</option><option value="1">1栋</option><option value="2">2栋</option><option value="3">3栋</option><option value="4">4栋</option><option value="5">5栋</option></select></label></div>
            <div class="video-list" id="cameraList"></div>
          </aside>
          <section class="video-content">
            <div class="video-stats">
              <div class="video-stat"><span class="video-stat-icon"><i class="fa-solid fa-video"></i></span><span class="video-stat-label">摄像机总数</span><span class="video-stat-value">433</span></div>
              <div class="video-stat"><span class="video-stat-icon"><i class="fa-solid fa-camera"></i></span><span class="video-stat-label">枪式摄像机</span><span class="video-stat-value">132</span></div>
              <div class="video-stat"><span class="video-stat-icon"><i class="fa-solid fa-camera-retro"></i></span><span class="video-stat-label">半球摄像机</span><span class="video-stat-value">290</span></div>
              <div class="video-stat"><span class="video-stat-icon"><i class="fa-solid fa-bullseye"></i></span><span class="video-stat-label">球型摄像机</span><span class="video-stat-value">11</span></div>
            </div>
            <article class="video-panel">
              <div class="video-panel-head"><span>视频监控</span><div class="video-grid-switch" role="group" aria-label="宫格切换"><button type="button" data-grid="1" aria-label="单画面" title="单画面"><i class="grid-icon grid-1"></i></button><button type="button" class="active" data-grid="2" aria-label="四宫格" title="四宫格"><i class="grid-icon grid-4"><span></span><span></span><span></span><span></span></i></button><button type="button" data-grid="3" aria-label="九宫格" title="九宫格"><i class="grid-icon grid-9"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></i></button><button type="button" data-grid="4" aria-label="十二宫格" title="十二宫格"><i class="grid-icon grid-12"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></i></button></div></div>
              <div class="video-grid" id="videoGrid"></div>
              <div class="pagination video-pagination"><span>共 <strong id="cameraCount">0</strong> 条，每页显示 <strong id="pageSizeLabel">4</strong> 条</span><span class="page-item" data-page="prev">‹</span><span class="page-item active" data-page-number>1</span><span class="page-item" data-page="next">›</span></div>
            </article>
          </section>
        </section>
      </div>
    </main>
  </div>
  <script src="../../../app/config/menu.js"></script>
  <script src="../../../app/components/sidebar.js"></script>
  <script src="../../../app/components/header.js"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script>
    const cameras = [
      { name: "屋面电梯机房门口", floor: "5" }, { name: "35层vip电梯厅", floor: "5" }, { name: "屋面北侧人屋面", floor: "5" }, { name: "35楼南部通道", floor: "5" },
      { name: "B1 东侧入口道闸", floor: "1" }, { name: "西侧出口道闸", floor: "1" }, { name: "3号楼大厅", floor: "3" }, { name: "2号楼地下车库", floor: "2" }, { name: "4号楼消防通道", floor: "4" }, { name: "1号楼消防通道", floor: "1" }, { name: "2号楼电梯厅", floor: "2" }, { name: "3号楼地下车库", floor: "3" }
    ];
    const image = "../../assets/images/access-gate.jpg";
    let pageSize = 4;
    let currentPage = 1;
    let currentGrid = 2;
    let visibleCameras = [...cameras];
    function renderCameraList() { document.getElementById("cameraList").innerHTML = visibleCameras.map((camera, index) => `<button class="video-list-item ${index === 0 ? "active" : ""}" data-camera="${index}"><i class="fa-solid fa-video"></i><span>${camera.name}</span></button>`).join(""); }
    function renderFeeds() { const start = (currentPage - 1) * pageSize; const pageCameras = visibleCameras.slice(start, start + pageSize); const columns = currentGrid === 1 ? 1 : currentGrid === 2 ? 2 : currentGrid === 3 ? 3 : 4; document.getElementById("videoGrid").style.gridTemplateColumns = `repeat(${columns}, minmax(0, 1fr))`; document.getElementById("videoGrid").innerHTML = pageCameras.map((camera) => `<div class="video-feed"><div class="video-feed-title"><span>${camera.name}</span><span>在线</span></div><div class="video-screen"><img src="${image}" alt="${camera.name}监控画面"></div></div>`).join(""); document.getElementById("cameraCount").textContent = visibleCameras.length; document.getElementById("pageSizeLabel").textContent = pageSize; document.querySelector("[data-page-number]").textContent = currentPage; document.querySelector('[data-page="prev"]').classList.toggle("disabled", currentPage === 1); document.querySelector('[data-page="next"]').classList.toggle("disabled", currentPage >= Math.max(1, Math.ceil(visibleCameras.length / pageSize))); }
    function filterFloor() { const floor = document.getElementById("floorFilter").value; visibleCameras = floor === "all" ? [...cameras] : cameras.filter((camera) => camera.floor === floor); currentPage = 1; renderCameraList(); renderFeeds(); }
    document.getElementById("floorFilter").addEventListener("change", filterFloor);
    document.addEventListener("click", (event) => { const gridButton = event.target.closest("[data-grid]"); if (gridButton) { currentGrid = Number(gridButton.dataset.grid); pageSize = currentGrid === 1 ? 1 : currentGrid === 2 ? 4 : currentGrid === 3 ? 9 : 12; currentPage = 1; document.querySelectorAll("[data-grid]").forEach((button) => button.classList.toggle("active", button === gridButton)); renderFeeds(); } const pageButton = event.target.closest("[data-page]"); if (pageButton) { const totalPages = Math.max(1, Math.ceil(visibleCameras.length / pageSize)); currentPage = pageButton.dataset.page === "prev" ? Math.max(1, currentPage - 1) : Math.min(totalPages, currentPage + 1); renderFeeds(); } const camera = event.target.closest("[data-camera]"); if (camera) { document.querySelectorAll("[data-camera]").forEach((item) => item.classList.toggle("active", item === camera)); } });
    renderCameraList();
    renderFeeds();
  </script>
</body>
</html>
